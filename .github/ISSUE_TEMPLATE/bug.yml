name: Bug
description: Something broken in dev or expected production behavior
title: "[Bug]: "
labels: ["type:bug"]
body:
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - Urgent — blocks deploy or data safety
        - High — major flow broken
        - Medium — minor / workaround exists
        - Low — cosmetic / nice to have
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - web
        - mobile
        - api
        - pdf-email
        - infra
        - security
        - other
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Browser, npm run db:reset, user role, etc.
    validations:
      required: false
