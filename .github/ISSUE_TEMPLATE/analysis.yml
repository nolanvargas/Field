name: Analysis
description: Decision or doc output before coding
title: "[Analysis]: "
labels: ["type:analysis"]
body:
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - Urgent — blocks other work
        - High — needed soon
        - Medium — exploratory
        - Low — someday / nice to have
    validations:
      required: true
  - type: textarea
    id: question
    attributes:
      label: Question to answer
    validations:
      required: true
  - type: textarea
    id: deliverable
    attributes:
      label: Deliverable
      description: Path under docs/ or issue comment with decision
      placeholder: docs/…
    validations:
      required: true
  - type: checkboxes
    id: no_code
    attributes:
      label: Scope
      options:
        - label: No code in this issue — doc/decision only
    validations:
      required: false
