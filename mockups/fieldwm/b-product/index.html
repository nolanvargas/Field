<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Field — field workforce management</title>
    <meta
      name="description"
      content="Task-centric field workforce management for operations teams."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../shared/reset.css" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="top-bar">
      <a class="top-bar-logo" href="./">
        <img src="../shared/logo.svg" width="32" height="32" alt="Field" />
      </a>
    </header>

    <div class="page">
      <main class="panel">
        <div class="intro">
          <p class="product-name">Field</p>
          <h1>Task-centric field workforce management</h1>
          <p class="subline">
            Create and assign work from the web; crew runs it on mobile with
            proof and customer tracking built in.
          </p>
        </div>

        <figure class="preview">
          <img
            src="assets/task-list-preview.svg"
            width="640"
            height="360"
            alt="Simplified task list view"
          />
          <figcaption>Illustrative task list — not a live product capture.</figcaption>
        </figure>

        <section class="contact" aria-labelledby="contact-heading">
          <h2 id="contact-heading">Contact</h2>
          <p class="contact-note">
            Mockup only — form does not submit.
            <a href="mailto:hello@fieldwm.com">hello@fieldwm.com</a>
          </p>
          <form class="contact-form" action="#" method="post" onsubmit="return false">
            <label>
              <span>Name</span>
              <input type="text" name="name" autocomplete="name" />
            </label>
            <label>
              <span>Work email</span>
              <input type="email" name="email" autocomplete="email" />
            </label>
            <label>
              <span>Message <span class="optional">(optional)</span></span>
              <textarea name="message" rows="3"></textarea>
            </label>
            <button type="submit">Send message</button>
          </form>
        </section>
      </main>

      <footer class="site-footer">
        <p>
          © 2026 Field · fieldwm.com ·
          <a href="#">Privacy</a> · <a href="#">Terms</a>
        </p>
        <p class="mockup-tag">Mockup B — product-adjacent</p>
      </footer>
    </div>
  </body>
</html>
